name: Render fixture

# Builds the fixture site at the repository root with the extension in
# ./_extensions, on the Quarto and Typst releases the course sites pin, through
# the same build core a course's build.py imports. A platform stylesheet change
# that breaks the bridge, a filter error, or a post-processor regression fails
# here rather than in a course repository.
#
# The unit tests run first. Then a local-style build must leave the working
# tree clean (the source stamps round-trip), put a PDF beside every page, and
# leave no kept .typ behind; then a --ci build must keep the date stamp. Typst
# refuses PDF/UA-1 output for any image or equation without alt text, so the
# PDFs compiling is the assertion that the post-processor reached every one.
#
# A pushed v* tag also publishes the GitHub release once that build passes,
# with the tag annotation as the notes. The platform's sync workflow pushes such
# tags over a deploy key after every stylesheet change; a hand-made release only
# needs the version bump and an annotated tag. `quarto update` in a course
# repository installs the latest release. The release job skips tags that
# already have one, so re-run it if it fails.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build.py stamps each page's date from `git log -1 -- <file>`.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.38"

      # Standalone Typst for the PDF/UA-1 compile; Quarto's bundled Typst has
      # no PDF/UA-1 support. Same release and digest as the course workflows.
      - name: Install Typst
        env:
          TYPST_VERSION: "0.14.2"
          # Digest of typst-x86_64-unknown-linux-musl.tar.xz from the GitHub
          # release; update alongside TYPST_VERSION.
          TYPST_SHA256: "a6044cbad2a954deb921167e257e120ac0a16b20339ec01121194ff9d394996d"
        run: |
          curl -fsSL -o /tmp/typst.tar.xz \
            "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          echo "${TYPST_SHA256}  /tmp/typst.tar.xz" | sha256sum -c -
          tar -xJf /tmp/typst.tar.xz --strip-components=1 -C /usr/local/bin
          typst --version

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pyyaml pytest

      - name: Unit tests
        run: python -m pytest tests/ -q

      - name: Build HTML and PDFs
        run: python build.py -v

      - name: Check that the sources were restored
        run: |
          set -e
          if [ -n "$(git status --porcelain)" ]; then
            echo "build.py left the working tree dirty:"
            git status --porcelain
            exit 1
          fi
          echo "working tree clean after the build"

      - name: Check the output
        run: |
          set -e
          test -f _site/index.html
          test -f _site/guide/elements.html
          grep -q 'class="cu-header"' _site/index.html
          grep -q 'id="quarto-sidebar"' _site/index.html
          grep -q 'quarto-bridge.css' _site/guide/elements.html
          ! grep -rq 'code-copy-button' _site/guide/elements.html
          test -f _site/index.pdf
          test -f _site/guide/index.pdf
          test -f _site/guide/elements.pdf
          ! grep -aq 'RobotoCondensed' _site/guide/elements.pdf
          grep -aq 'Roboto-Regular' _site/guide/elements.pdf
          grep -aq 'pdfuaid:part' _site/guide/elements.pdf
          kept="$(find . -name '*.typ' -not -path './_extensions/*' -not -path './.quarto/*' -not -path './_site/*')"
          if [ -n "$kept" ]; then
            echo "kept .typ left in the tree:"; echo "$kept"; exit 1
          fi
          echo "fixture built: chrome, sidebar, bridge stylesheet, a PDF/UA-1 PDF beside every page, no kept .typ"

      - name: Build PDFs in CI mode
        run: python build.py -v --ci --pdf

      - name: Check that --ci kept the stamp
        run: |
          set -e
          grep -q '^date: "' index.qmd
          echo "date stamp kept with --ci"

      # The template's own contributions, read off a kept .typ: the header
      # stamp comes from physicslabs.title and unlabeled equations are not
      # numbered. A single-page render keeps the .typ beside the source.
      - name: Check the Typst template
        run: |
          set -e
          quarto render guide/elements.qmd --to typst --profile typst || true
          test -f guide/elements.typ
          grep -q 'course: "Fixture Course"' guide/elements.typ
          ! grep -qE '^\s*set math\.equation\(numbering' guide/elements.typ
          echo "template stamps the course and leaves unlabeled equations unnumbered"

  release:
    needs: render
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish the release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          # actions/checkout leaves an annotated tag lightweight in the clone;
          # refetch it so the notes come from the annotation.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-from-tag
          echo "published $TAG"
