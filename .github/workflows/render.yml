name: Render fixture

# Renders the fixture site at the repository root with the extension in
# ./_extensions, on the Quarto release the course sites pin. A platform
# stylesheet change that breaks the bridge, or a filter error, fails here
# rather than in a course repository.
#
# A pushed v* tag also publishes the GitHub release once that render passes,
# with the tag annotation as the notes. The platform's sync workflow pushes such
# tags over a deploy key after every stylesheet change; a hand-made release only
# needs the version bump and an annotated tag. `quarto update` in a course
# repository installs the latest release. The release job skips tags that
# already have one, so re-run it if it fails.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.38"

      # One render of every format the extension contributes. Rendering the
      # formats separately does not work: a project render cleans _site first,
      # so the second format's run removes the first format's output.
      - name: Render HTML and Typst
        run: quarto render

      - name: Check the output
        run: |
          set -e
          test -f _site/index.html
          test -f _site/guide/elements.html
          grep -q 'class="cu-header"' _site/index.html
          grep -q 'id="quarto-sidebar"' _site/index.html
          grep -q 'quarto-bridge.css' _site/guide/elements.html
          ! grep -rq 'code-copy-button' _site/guide/elements.html
          test -f _site/guide/elements.pdf
          ! grep -aq 'RobotoCondensed' _site/guide/elements.pdf
          grep -aq 'Roboto-Regular' _site/guide/elements.pdf
          grep -q 'course: "Fixture Course"' guide/elements.typ
          ! grep -qE '^\s*set math\.equation\(numbering' guide/elements.typ
          echo "fixture rendered with chrome, sidebar, bridge stylesheet, and stamped PDFs"

  release:
    needs: render
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish the release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          # actions/checkout leaves an annotated tag lightweight in the clone;
          # refetch it so the notes come from the annotation.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-from-tag
          echo "published $TAG"
