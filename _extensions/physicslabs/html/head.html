<!-- physicslabs: the platform's fonts, and its dark-mode attribute set before first paint -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
<script>
(function () {
  var dark = false;
  try { dark = localStorage.getItem('quarto-color-scheme') === 'alternate'; } catch (e) {}
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
})();
</script>
