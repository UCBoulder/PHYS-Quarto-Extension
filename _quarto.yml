# Fixture site: renders with the extension from ./_extensions so that a change
# to the extension (or a synced platform stylesheet) is exercised in CI and can
# be previewed here with `quarto preview`.
project:
  type: physicslabs
  output-dir: _site
  # The fixture pages only; docs/ holds the runbook, not site content.
  render:
    - index.qmd
    - guide/*.qmd

website:
  title: "Fixture Course"

physicslabs:
  title: "Fixture Course"
